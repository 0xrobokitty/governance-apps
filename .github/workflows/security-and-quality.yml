name: Security And Quality

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          check-latest: true
          cache: "npm"

      - name: Setup npm
        env:
          npm_config_min_release_age: "0"
        run: npm install --global npm@11.14.0

      - name: Validate Dependency Policy
        run: npm run validate:deps

      - name: Configure npm Install Policy
        run: node ./scripts/configure-npm-install-policy.mjs >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: npm ci

      - name: Validate Production Env Invariants
        env:
          NODE_ENV: production
          NEXT_PUBLIC_RUNTIME_MODE: "production"
          NEXT_PUBLIC_USE_MOCKS: "false"
          NEXT_PUBLIC_E2E: "false"
          NEXT_PUBLIC_WC_PROJECT_ID: "ci-placeholder"
          NEXT_PUBLIC_GLOBAL_DATA_URL: "https://example.invalid/global-data.json"
          NEXT_PUBLIC_RPC_URLS: "https://example.invalid/rpc"
        run: npm run validate:prod-env

      - name: Typecheck
        run: npm run typecheck

      - name: Check Generated DAO Artifacts
        run: npm run generate:dao-feed -- --check

      - name: Lint
        run: npm run lint

      - name: Unit And Integration Tests
        run: npm test

      - name: Production Worker Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          WRANGLER_SEND_METRICS: "false"
          NEXT_PUBLIC_RUNTIME_MODE: "production"
          NEXT_PUBLIC_USE_MOCKS: "false"
          NEXT_PUBLIC_E2E: "false"
          NEXT_PUBLIC_ENABLE_DEBUG_UI: "false"
          NEXT_PUBLIC_ENABLE_DAO: "false"
          NEXT_PUBLIC_ENABLE_TEAMS: "false"
          NEXT_PUBLIC_ENABLE_YBC: "false"
          NEXT_PUBLIC_ENABLE_YETH: "false"
          NEXT_PUBLIC_ENABLE_TREASURY: "false"
          NEXT_PUBLIC_WC_PROJECT_ID: "ci-placeholder"
          NEXT_PUBLIC_GLOBAL_DATA_URL: "https://example.invalid/global-data.json"
          NEXT_PUBLIC_RPC_URLS: "https://example.invalid/rpc"
        run: npm run worker:build

      - name: Validate Worker Runtime
        run: npm run validate:worker-runtime -- wrangler.jsonc
